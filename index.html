<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0a0b" />
<title>OMERO GYM — Book Your Slot</title>
<meta name="description" content="OMERO GYM — book premium floor access, group classes, and personal training sessions." />

<!--
  ============================================================================
  OMERO GYM  —  single-file website (HTML + CSS + JavaScript all in one)
  ============================================================================
  HOW TO EDIT (VS Code):
   1. Colours / fonts / spacing  ->  see the :root variables in the <style> block.
   2. Sessions, prices, durations ->  see the SESSIONS array in the <script> block.
   3. Time blocks                 ->  see the TIME_BLOCKS array.
   4. Page content / text         ->  see the render*() functions in <script>.
  Just double-click this file to open it in a browser. No build tools needed.
  Login/booking data is saved in the browser (localStorage) — no backend.
  ============================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
/* ============================ DESIGN TOKENS ============================ */
:root{
  --bg:#0a0a0b;          /* page background      */
  --surface:#151517;     /* cards / panels       */
  --raised:#1c1c20;      /* inputs / ghost btn   */
  --border:rgba(255,255,255,.07);
  --accent:#e02434;      /* THE red accent       */
  --accent-soft:#f04452;
  --text:#ffffff;
  --muted:#9a9aa2;
  --radius:16px;
  --shell:1120px;
  --font:"Inter",system-ui,sans-serif;
  --display:"Oswald","Arial Narrow",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}

/* ============================ RESET / BASE ============================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
img,svg{display:block}
:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8);cursor:pointer}

/* ============================ BACKGROUND ============================ */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.bg-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% -10%,rgba(224,36,52,.10),transparent 45%)}
.bg-grid{position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%);
          mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%)}
.watermark{position:absolute;top:0;height:100%;width:15%;display:none;flex-direction:column;justify-content:center;gap:24px;padding:0 24px;pointer-events:none;user-select:none}
.watermark.left{left:0;align-items:flex-start}
.watermark.right{right:0;align-items:flex-end;text-align:right}
.watermark span{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:34px;line-height:1;color:rgba(255,255,255,.05)}
.watermark span.red{color:rgba(224,36,52,.15)}
@media(min-width:1024px){.watermark{display:flex}}

/* ============================ LAYOUT ============================ */
.app{position:relative;display:flex;flex-direction:column;min-height:100vh}
.shell{width:100%;max-width:var(--shell);margin:0 auto;padding:0 16px}
main{flex:1;padding:32px 0}
.auth-main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
footer{padding:16px 0 24px}
.footer-inner{max-width:var(--shell);margin:0 auto;padding:16px 16px 0;border-top:1px solid var(--border);text-align:center;font-size:12px;color:rgba(255,255,255,.4)}

/* ============================ NAVBAR ============================ */
header{position:sticky;top:0;z-index:40;padding:16px 16px 0}
.nav{max-width:var(--shell);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  border:1px solid var(--border);background:rgba(15,15,17,.8);backdrop-filter:blur(10px);border-radius:16px;padding:10px 18px}
.logo{display:inline-flex;align-items:center;gap:10px}
.logo-badge{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--accent);box-shadow:0 4px 14px -4px rgba(224,36,52,.8)}
.logo-text{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:.5px}
.logo-text .r{color:var(--accent)}
.nav-links{display:flex;align-items:center;gap:4px;list-style:none}
.nav-link{border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;color:rgba(255,255,255,.7);transition:.2s}
.nav-link:hover{color:#fff}
.nav-link.active{background:var(--accent);color:#fff}
.nav-right{display:flex;align-items:center;gap:12px}
.hello{display:flex;align-items:center;gap:6px;font-size:14px;color:rgba(255,255,255,.7)}
.hello svg{color:var(--accent)}
.nav-toggle{display:none;padding:8px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.04)}
.mobile-menu{max-width:var(--shell);margin:8px auto 0;border:1px solid var(--border);background:rgba(15,15,17,.95);backdrop-filter:blur(10px);border-radius:16px;padding:12px;display:none;flex-direction:column;gap:6px}
.mobile-menu.open{display:flex}
.mobile-menu a,.mobile-menu button{border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500;color:rgba(255,255,255,.8);text-align:left}
.mobile-menu a.active{background:var(--accent);color:#fff}
@media(max-width:767px){.nav-links,.nav-right{display:none}.nav-toggle{display:inline-flex}}

/* ============================ BUTTONS ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;transition:.2s;user-select:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 20px -8px rgba(224,36,52,.7)}
.btn-primary:not(:disabled):hover{background:var(--accent-soft)}
.btn-ghost{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.9)}
.btn-ghost:hover{background:rgba(255,255,255,.08)}
.btn-block{width:100%}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:10px}

/* ============================ FORMS ============================ */
.field-label{display:block;font-size:14px;font-weight:500;color:rgba(255,255,255,.8);margin-bottom:6px}
.field{width:100%;border:1px solid rgba(255,255,255,.1);background:var(--raised);border-radius:12px;padding:10px 14px;font-size:14px;color:#fff;transition:.2s}
.field::placeholder{color:rgba(255,255,255,.35)}
.field:focus{outline:none;border-color:var(--accent)}
.help{font-size:12px;color:rgba(255,255,255,.4);margin-top:6px}

/* ============================ COMPONENTS ============================ */
.card{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.22em;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:rgba(255,255,255,.7);transition:.2s}
.pill:hover{border-color:rgba(255,255,255,.25);color:#fff}
.pill.active{border-color:var(--accent);background:var(--accent);color:#fff}

/* auth card */
.auth-card{width:100%;max-width:440px}
.auth-inner{padding:32px}
.brand-badge{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:var(--accent);margin:0 auto;box-shadow:0 8px 24px -8px rgba(224,36,52,.9)}
.auth-title{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.5px;text-align:center;margin-top:16px}
.auth-sub{font-size:14px;color:var(--muted);text-align:center;margin-top:6px}
.stack>*+*{margin-top:16px}
.center-link{text-align:center;font-size:14px;color:var(--muted);margin-top:20px}
.center-link a{color:var(--accent);font-weight:600}
.center-link a:hover{color:var(--accent-soft)}

/* hero */
.hero{text-align:center}
.hero h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.05;margin:12px auto 0;max-width:620px}
.hero h1 .r{color:var(--accent)}
.hero p{font-size:14px;color:var(--muted);margin:16px auto 0;max-width:520px}
.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px}
@media(max-width:640px){.hero h1{font-size:34px}}

/* session sections */
.section{margin-top:48px}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.dot{width:8px;height:8px;border-radius:999px;background:var(--accent)}
.section-head h2{font-family:var(--display);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.18em;color:rgba(255,255,255,.9)}
.section-head .rule{flex:1;height:1px;background:var(--border)}
.grid2{display:grid;gap:16px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.s-card{padding:24px;display:flex;flex-direction:column;transition:.2s}
.s-card:hover{border-color:rgba(255,255,255,.15);background:var(--raised)}
.s-card h3{font-family:var(--display);font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.s-card p{font-size:14px;color:var(--muted);margin-top:8px}
.s-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:20px}
.price{font-family:var(--display);font-size:24px;font-weight:700}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.45);margin-top:4px}

/* page title */
.page-title{font-family:var(--display);font-weight:700;font-size:34px;margin-top:12px}
.page-sub{font-size:14px;color:var(--muted);margin-top:8px}

/* book layout */
.book-grid{display:grid;gap:20px;margin-top:32px}
@media(min-width:1024px){.book-grid{grid-template-columns:1fr 360px}}
.stepper{display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--border);padding-bottom:20px}
.step{border:1px solid rgba(255,255,255,.1);background:transparent;color:rgba(255,255,255,.4)}
.step.done{background:rgba(255,255,255,.04);color:rgba(255,255,255,.7)}
.step.current{border-color:var(--accent);background:rgba(224,36,52,.15);color:var(--accent)}
.step b{font-family:var(--mono)}
.blocks-empty{margin-top:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:1px dashed rgba(255,255,255,.1);border-radius:12px;padding:40px;text-align:center;color:rgba(255,255,255,.4);font-size:14px}
.blocks{margin-top:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.blocks{grid-template-columns:repeat(3,1fr)}}
.block{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);border-radius:12px;padding:12px;font-size:14px;font-weight:500;color:rgba(255,255,255,.8);transition:.2s}
.block:hover{border-color:rgba(255,255,255,.25)}
.block.active{border-color:var(--accent);background:var(--accent);color:#fff}
.panel-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.panel-head h2{font-family:var(--display);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.9)}
.panel-head svg{color:var(--accent)}
.pad{padding:20px}
.sum-label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.4)}
.sum-title{font-family:var(--display);font-size:18px;font-weight:600;margin-top:4px}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.sum-val{font-family:var(--display);font-size:18px;font-weight:700;margin-top:4px}
.sum-val.red{color:var(--accent)}
.tips{list-style:none;display:flex;flex-direction:column;gap:12px;padding:20px;font-size:14px;color:rgba(255,255,255,.7)}
.tips li{display:flex;gap:10px}
.tips svg{color:var(--accent);flex-shrink:0;margin-top:2px}
.sched{margin-top:20px;border:1px solid var(--border);background:rgba(255,255,255,.02);border-radius:12px;padding:12px;font-size:14px;color:rgba(255,255,255,.7)}
.sched span{color:rgba(255,255,255,.4)}

/* dashboard tables */
.dash-title{display:flex;align-items:center;gap:12px}
.dash-badge{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:rgba(224,36,52,.15);color:var(--accent)}
.panel{margin-top:24px;overflow:hidden}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;text-align:left;min-width:640px}
th{padding:0 12px 12px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.4)}
td{padding:14px 12px;border-top:1px solid rgba(255,255,255,.05);vertical-align:middle}
.id{font-family:var(--mono);color:var(--accent)}
.right{text-align:right}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;border:1px solid}
.badge.confirmed{background:rgba(16,185,129,.15);color:#34d399;border-color:rgba(16,185,129,.3)}
.badge.attended{background:rgba(14,165,233,.15);color:#38bdf8;border-color:rgba(14,165,233,.3)}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px;text-align:center;color:rgba(255,255,255,.4);font-size:14px}
.fade{animation:fade .4s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>

<body>
<div id="app"></div>

<script>
/* ============================================================================
   DATA  — edit sessions / prices / time blocks here
   ============================================================================ */
const CATEGORIES = [
  { id:"floor",    label:"General Gym Floor Access", filter:"Gym Floor Access" },
  { id:"classes",  label:"Group Fitness Classes",    filter:"Group Fitness Classes" },
  { id:"personal", label:"Personal Training (1-on-1)", filter:"Personal Training" },
];

const SESSIONS = [
  { id:"peak-floor",    category:"floor",    title:"Peak Hours Floor Pass",
    description:"Reservation for dynamic weight training and cardio equipment during premium high-energy intervals.",
    price:1500, duration:90 },
  { id:"offpeak-floor", category:"floor",    title:"Off-Peak Floor Pass",
    description:"Perfect for crowd-free workouts with total accessibility to all lifting racks and fitness gear.",
    price:1000, duration:120 },
  { id:"hiit-blast",    category:"classes",  title:"High Intensity HIIT Blast",
    description:"Metabolic conditioning, functional intervals, and explosive plyometrics orchestrated by elite instructors.",
    price:2500, duration:60 },
  { id:"elite-power",   category:"personal", title:"Elite Power & Strength Coaching",
    description:"Custom programming focusing heavily on biomechanics, heavy lifting form, and progressive overloading vectors.",
    price:5000, duration:60 },
];

const TIME_BLOCKS = ["06:00 AM","08:00 AM","10:00 AM","04:00 PM","05:00 PM","07:00 PM"];

const SEED_PAST = [
  { id:"OM-4112", title:"High Intensity HIIT Blast", date:"2026-06-12", time:"06:00 AM", price:2500, status:"Attended" },
];

/* ============================ HELPERS ============================ */
const $ = (id)=>document.getElementById(id);
const app = $("app");
const LKR = (n)=>"LKR "+n.toLocaleString("en-US");
const getSession = (id)=>SESSIONS.find(s=>s.id===id);
const today = ()=>new Date().toISOString().split("T")[0];
const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Safe storage: uses localStorage when available, otherwise falls back to an
   in-memory store. (Browsers block localStorage on file:// — this keeps the app
   working even when you just double-click the file. When served over http it
   persists normally across reloads.) */
const _mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch{ return (k in _mem)?_mem[k]:null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch{ _mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch{ delete _mem[k]; } },
};
const getUser = ()=>{try{return JSON.parse(store.get("omero.user"))}catch{return null}};
const setUser = (u)=>store.set("omero.user",JSON.stringify(u));
const clearUser = ()=>store.del("omero.user");
const getBookings = ()=>{try{return JSON.parse(store.get("omero.bookings"))||[]}catch{return []}};
const setBookings = (b)=>store.set("omero.bookings",JSON.stringify(b));

/* transient UI state */
let ui = { filter:"all", menuOpen:false };
let book = { sessionId:"", date:"", time:"" };

/* ============================ ICONS (inline SVG) ============================ */
function icon(name,size){
  size = size||16;
  const P = {
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    arrow:'<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>',
    check:'<path d="M20 6 9 17l-5-5"/>',
    x:'<path d="M18 6 6 18"/><path d="M6 6l12 12"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
    login:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/>',
    logout:'<path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
    rotate:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
    info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M11 12h1v4h1"/>',
    menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
    userplus:'<circle cx="9" cy="8" r="4"/><path d="M3 21c0-4 3-6 6-6s6 2 6 6"/><path d="M19 8v6M22 11h-6"/>',
    history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 8v4l3 2"/>',
    ban:'<circle cx="12" cy="12" r="9"/><path d="M5 5l14 14"/>',
    bag:'<path d="M6 8h12l-1 12H7z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
    users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path d="M16 6a3 3 0 0 1 0 6"/>',
    timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',
    dumbbell:'<path d="M6 7v10M4 9v6M18 7v10M20 9v6M6 12h12"/>',
  };
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(P[name]||"")+'</svg>';
}
/* filled dumbbell for the logo badge */
const LOGO_MARK = '<svg width="18" height="18" viewBox="0 0 512 512" fill="#fff"><rect x="176" y="236" width="160" height="40" rx="20"/><rect x="140" y="196" width="44" height="120" rx="16"/><rect x="328" y="196" width="44" height="120" rx="16"/><rect x="96" y="216" width="40" height="80" rx="14"/><rect x="376" y="216" width="40" height="80" rx="14"/></svg>';

/* ============================ SHARED CHROME ============================ */
function background(){
  const words = w => '<span class="'+(w==="TOMORROW"?"red":"")+'">'+w+'</span>';
  const set = ["DISCIPLINE","TODAY","STRENGTH","TOMORROW"].map(words).join("");
  return '<div class="bg"><div class="bg-glow"></div><div class="bg-grid"></div>'
       + '<div class="watermark left">'+set+'</div><div class="watermark right">'+set+'</div></div>';
}
function logo(){
  return '<a class="logo" href="#/"><span class="logo-badge">'+LOGO_MARK+'</span>'
       + '<span class="logo-text">OMERO <span class="r">GYM</span></span></a>';
}
function navbar(route){
  const user = getUser();
  const links = [["#/classes","Classes & Sessions"],["#/book","Book a Slot"],["#/workouts","My Workouts"]];
  const isActive = (h)=>route===h.replace("#","")?"active":"";

  let right, desktopLinks="", mobile="";
  if(user){
    desktopLinks = '<ul class="nav-links">'+links.map(l=>'<li><a class="nav-link '+isActive(l[0])+'" href="'+l[0]+'">'+l[1]+'</a></li>').join("")+'</ul>';
    right = '<div class="nav-right"><span class="hello">'+icon("user",15)+' Hello, '+esc(user.name)+'</span>'
          + '<button class="btn btn-ghost btn-sm" data-action="logout">'+icon("logout",15)+' Logout</button></div>';
    mobile = '<span class="hello" style="padding:8px 12px">'+icon("user",15)+' Hello, '+esc(user.name)+'</span>'
           + links.map(l=>'<a class="'+isActive(l[0])+'" href="'+l[0]+'" data-action="close-menu">'+l[1]+'</a>').join("")
           + '<button class="btn btn-ghost" data-action="logout">'+icon("logout",15)+' Logout</button>';
  } else {
    desktopLinks = '<span></span>';
    right = '<div class="nav-right"><a class="nav-link" href="#/login">'+icon("login",15)+' Login</a>'
          + '<a class="btn btn-primary btn-sm" href="#/register">Create Account</a></div>';
    mobile = '<a href="#/login" data-action="close-menu">'+icon("login",15)+' Login</a>'
           + '<a href="#/register" data-action="close-menu">Create Account</a>';
  }
  return '<header><nav class="nav">'+logo()+desktopLinks+right
       + '<button class="nav-toggle" data-action="toggle-menu" aria-label="Menu">'+icon("menu",18)+'</button></nav>'
       + '<div class="mobile-menu'+(ui.menuOpen?" open":"")+'">'+mobile+'</div></header>';
}
function shell(route,content){
  return background()
       + '<div class="app">'+navbar(route)
       + '<main><div class="shell">'+content+'</div></main>'
       + '<footer><div class="footer-inner">© '+new Date().getFullYear()+' OMERO GYM · Discipline today, strength tomorrow.</div></footer></div>';
}
function authShell(content){
  return background()+'<div class="app">'+navbar("")+'<div class="auth-main">'+content+'</div></div>';
}

/* ============================ PAGES ============================ */
function loginPage(){
  return authShell(
    '<div class="auth-card fade"><div class="card auth-inner">'
    + '<div class="brand-badge">'+icon("dumbbell",24)+'</div>'
    + '<h1 class="auth-title">OMERO GYM PORTAL</h1>'
    + '<p class="auth-sub">Log in to secure your workout schedule &amp; classes</p>'
    + '<form id="loginForm" class="stack" style="margin-top:28px">'
    +   '<div><label class="field-label" for="li-email">Email Address</label>'
    +   '<input class="field" id="li-email" type="email" required placeholder="athlete@example.com"></div>'
    +   '<div><label class="field-label" for="li-pass">Password</label>'
    +   '<input class="field" id="li-pass" type="password" required placeholder="••••••••"></div>'
    +   '<button class="btn btn-primary btn-block" type="submit">'+icon("login")+' Sign In</button>'
    + '</form>'
    + '<p class="center-link">New to OMERO GYM? <a href="#/register">Create an Account Here</a></p>'
    + '</div></div>'
  );
}

function registerPage(){
  return authShell(
    '<div class="auth-card fade"><div class="card auth-inner">'
    + '<div class="brand-badge">'+icon("userplus",24)+'</div>'
    + '<h1 class="auth-title">CREATE ACCOUNT</h1>'
    + '<p class="auth-sub">Join us to instantly unlock interactive capacity slots</p>'
    + '<form id="registerForm" class="stack" style="margin-top:28px">'
    +   '<div><label class="field-label" for="rg-name">Full Name</label>'
    +   '<input class="field" id="rg-name" required placeholder="John Doe"></div>'
    +   '<div><label class="field-label" for="rg-email">Email Address</label>'
    +   '<input class="field" id="rg-email" type="email" required placeholder="john@example.com"></div>'
    +   '<div><label class="field-label" for="rg-phone">Phone Number</label>'
    +   '<input class="field" id="rg-phone" type="tel" placeholder="+94 7X XXX XXXX"></div>'
    +   '<div><label class="field-label" for="rg-pass">Password</label>'
    +   '<input class="field" id="rg-pass" type="password" required minlength="6" placeholder="Minimum 6 characters">'
    +   '<p class="help">Passwords are hashed securely using bcrypt in our system.</p></div>'

    + '</form>'

function sessionCard(s){
  return '<article class="card s-card">'
    + '<h3>'+esc(s.title)+'</h3><p>'+esc(s.description)+'</p>'
    + '<div class="s-foot"><div>'
    +   '<div class="price">'+LKR(s.price)+'</div>'
    +   '<div class="meta">'+icon("clock",13)+' '+s.duration+' mins</div></div>'
    +   '<button class="btn btn-primary" data-book="'+s.id+'">Book Slot '+icon("arrow",15)+'</button>'
    + '</div></article>';
}
function classesPage(route){
  const pill=(id,label)=>'<button class="pill '+(ui.filter===id?"active":"")+'" data-filter="'+id+'">'+label+'</button>';
  const filters='<div class="filters">'+pill("all","All")+CATEGORIES.map(c=>pill(c.id,c.filter)).join("")+'</div>';
  const cats = ui.filter==="all"?CATEGORIES:CATEGORIES.filter(c=>c.id===ui.filter);
  const sections = cats.map(cat=>{
    const items=SESSIONS.filter(s=>s.category===cat.id);
    if(!items.length) return "";
    return '<section class="section"><div class="section-head"><span class="dot"></span>'
      + '<h2>'+cat.label+'</h2><span class="rule"></span></div>'
      + '<div class="grid2">'+items.map(sessionCard).join("")+'</div></section>';
  }).join("");
  const hero='<section class="hero fade"><span class="eyebrow">OMERO GYM — Session Catalog</span>'
    + '<h1>PICK YOUR SLOT.<br><span class="r">OWN THE FLOOR.</span></h1>'
    + '<p>Book premium floor access, group classes, and personal training sessions at OMERO GYM.</p>'
    + filters+'</section>';
  return shell(route,hero+sections);
}

function bookPage(route){
  const s=getSession(book.sessionId);
  const stepIdx = !book.date?0:!book.time?1:2;
  const STEPS=["Pick a date","Choose a time block","Confirm"];
  const stepper='<ol class="stepper">'+STEPS.map((label,i)=>{
    const cls=i===stepIdx?"current":i<stepIdx?"done":"";
    return '<span class="pill step '+cls+'"><b>'+(i+1)+'</b> '+label+'</span>';
  }).join("")+'</ol>';

  const options='<option value="">Select a session…</option>'+
    SESSIONS.map(x=>'<option value="'+x.id+'" '+(x.id===book.sessionId?"selected":"")+'>'+esc(x.title)+' — '+LKR(x.price)+'</option>').join("");

  const blocks = !book.date
    ? '<div class="blocks-empty">'+icon("calendar",26)+'<p>Select a date above to reveal live time-block availability.</p></div>'
    : '<div class="blocks">'+TIME_BLOCKS.map(t=>'<button class="block '+(book.time===t?"active":"")+'" data-time="'+t+'">'+t+'</button>').join("")+'</div>';

  const left='<div class="card pad">'+stepper
    + '<div style="margin-top:24px"><label class="field-label" for="bk-session">Session / Class</label>'
    +   '<select class="field" id="bk-session">'+options+'</select></div>'
    + '<div style="margin-top:20px"><label class="field-label" for="bk-date">1. Choose Booking Date</label>'
    +   '<input class="field" id="bk-date" type="date" min="'+today()+'" value="'+book.date+'"></div>'
    + '<div style="margin-top:24px"><label class="field-label">2. Choose a Time Block</label>'+blocks+'</div>'
    + '<button class="btn btn-primary btn-block" style="margin-top:28px" id="confirmBtn" '+(s&&book.date&&book.time?"":"disabled")+'>'+icon("check")+' Confirm Booking</button>'
    + '</div>';

  const sched=(book.date&&book.time)?'<div class="sched"><span>Scheduled:</span> '+book.date+' · '+book.time+'</div>':'';
  const summary='<div class="card"><div class="panel-head"><h2>Booking Summary</h2></div><div class="pad">'
    + '<p class="sum-label">Selected Workout / Class</p>'
    + '<p class="sum-title">'+(s?esc(s.title):"Please pick a session card")+'</p>'
    + '<div class="sum-grid"><div><p class="sum-label">'+icon("timer",14)+' Duration</p><p class="sum-val">'+(s?s.duration+" mins":"—")+'</p></div>'
    +   '<div><p class="sum-label">'+icon("clock",14)+' Session Cost</p><p class="sum-val red">'+(s?LKR(s.price):"—")+'</p></div></div>'
    + sched+'</div></div>';

  const tip=(ic,txt)=>'<li>'+icon(ic,15)+'<span>'+txt+'</span></li>';
  const know='<div class="card" style="margin-top:20px"><div class="panel-head">'+icon("info",15)+'<h2>Good to Know</h2></div>'
    + '<ul class="tips">'+tip("info","Arrive at least 10 minutes early to badge in at reception.")
    + tip("ban","Free cancellation up to 2 hours before your slot starts.")
    + tip("bag","Bring a towel and indoor shoes — lockers are available on-site.")
    + tip("users","Slots are capacity-limited, so booked times can't be double-reserved.")+'</ul></div>';

  const head='<section class="fade"><span class="eyebrow">Reserve Your Spot</span>'
    + '<h1 class="page-title">BOOK A TRAINING SLOT</h1>'
    + '<p class="page-sub">Pick a date and an open time block below — your session locks in instantly.</p></section>';

  return shell(route,head+'<div class="book-grid">'+left+'<aside>'+summary+know+'</aside></div>');
}

function workoutsPage(route){
  const t=today();
  const all=getBookings();
  const upcoming=all.filter(b=>b.date>=t);
  const past=[...all.filter(b=>b.date<t).map(b=>({...b,status:"Attended"})),...SEED_PAST];

  const rowUp=(b)=>'<tr><td class="id">'+b.id+'</td><td style="font-weight:500">'+esc(b.title)+'</td>'
    + '<td style="color:rgba(255,255,255,.7)">'+b.date+' · '+b.time+'</td>'
    + '<td style="color:rgba(255,255,255,.7)">'+LKR(b.price)+'</td>'
    + '<td><span class="badge confirmed">Confirmed</span></td>'
    + '<td class="right"><button class="btn btn-ghost btn-sm" data-cancel="'+b.id+'">'+icon("x",13)+' Cancel</button></td></tr>';
  const rowPast=(b)=>'<tr><td class="id">'+b.id+'</td><td style="font-weight:500">'+esc(b.title)+'</td>'
    + '<td style="color:rgba(255,255,255,.7)">'+b.date+' · '+b.time+'</td>'
    + '<td style="color:rgba(255,255,255,.7)">'+LKR(b.price)+'</td>'
    + '<td><span class="badge attended">Attended</span></td>'
    + '<td class="right"><a class="btn btn-ghost btn-sm" href="#/book">'+icon("rotate",13)+' Book Again</a></td></tr>';

  const upBody = upcoming.length
    ? '<div class="table-wrap"><table><thead><tr><th>Reservation ID</th><th>Class / Session</th><th>Scheduled Date &amp; Time</th><th>Cost</th><th>Status</th><th class="right">Actions</th></tr></thead><tbody>'+upcoming.map(rowUp).join("")+'</tbody></table></div>'
    : '<div class="empty"><p>No upcoming slots yet.</p><a class="btn btn-primary" href="#/book">Book a Slot</a></div>';

  const pastBody='<div class="table-wrap"><table><thead><tr><th>Reservation ID</th><th>Session</th><th>Date &amp; Time</th><th>Cost</th><th>Status</th><th class="right">Shortcut</th></tr></thead><tbody>'+past.map(rowPast).join("")+'</tbody></table></div>';

  const title='<section class="dash-title fade"><span class="dash-badge">'+icon("dumbbell",18)+'</span>'
    + '<h1 class="page-title" style="margin:0">MY WORKOUT DASHBOARD</h1></section>';
  const p1='<section class="card panel"><div class="panel-head">'+icon("calendar",16)+'<h2>Upcoming Scheduled Slots</h2></div><div class="pad">'+upBody+'</div></section>';
  const p2='<section class="card panel"><div class="panel-head">'+icon("history",16)+'<h2>Past Session Logs</h2></div><div class="pad">'+pastBody+'</div></section>';
  return shell(route,title+p1+p2);
}

/* ============================ ROUTER ============================ */
const PROTECTED=["/classes","/book","/workouts"];
let currentRoute="/login";

function resolveRoute(){
  let r=location.hash.replace("#","")||"/";
  if(r==="/") r=getUser()?"/classes":"/login";
  if(PROTECTED.includes(r)&&!getUser()) r="/login";
  if((r==="/login"||r==="/register")&&getUser()) r="/classes";
  return r;
}
function paint(){
  const r=resolveRoute();
  currentRoute=r;
  if(r==="/login") app.innerHTML=loginPage();
  else if(r==="/register") app.innerHTML=registerPage();
  else if(r==="/classes") app.innerHTML=classesPage(r);
  else if(r==="/book") app.innerHTML=bookPage(r);
  else if(r==="/workouts") app.innerHTML=workoutsPage(r);
  else { location.hash="/"; return; }
  wire(r);
  window.scrollTo(0,0);
}
function go(route){ if(("#"+route)===location.hash){ paint(); } else { location.hash=route; } }

/* attach page-specific event listeners after each paint */
function wire(r){
  const lf=$("loginForm");
  if(lf) lf.addEventListener("submit",e=>{
    e.preventDefault();
    setUser({ name:"Dedicated Athlete", email:$("li-email").value });
    go("/classes");
  });
  const rf=$("registerForm");
  if(rf) rf.addEventListener("submit",e=>{
    e.preventDefault();
    const name=$("rg-name").value.trim()||"Dedicated Athlete";
    setUser({ name, email:$("rg-email").value });
    go("/classes");
  });
  if(r==="/book"){
    const sel=$("bk-session"); if(sel) sel.addEventListener("change",e=>{book.sessionId=e.target.value;paint();});
    const dt=$("bk-date"); if(dt) dt.addEventListener("change",e=>{book.date=e.target.value;book.time="";paint();});
    const cb=$("confirmBtn"); if(cb) cb.addEventListener("click",()=>{
      const s=getSession(book.sessionId);
      if(!s||!book.date||!book.time) return;
      const rec={ id:"OM-"+Math.floor(1000+Math.random()*9000), status:"Confirmed",
        sessionId:s.id, title:s.title, price:s.price, duration:s.duration, date:book.date, time:book.time };
      setBookings([rec,...getBookings()]);
      book={ sessionId:"", date:"", time:"" };
      go("/workouts");
    });
  }
}

/* global click delegation (nav, filters, book buttons, cancel, menu) */
document.addEventListener("click",(e)=>{
  const t=e.target.closest("[data-action],[data-filter],[data-book],[data-time],[data-cancel]");
  if(!t) return;
  if(t.dataset.action==="logout"){ clearUser(); ui.menuOpen=false; go("/login"); }
  else if(t.dataset.action==="toggle-menu"){ ui.menuOpen=!ui.menuOpen; paint(); }
  else if(t.dataset.action==="close-menu"){ ui.menuOpen=false; }
  else if(t.dataset.filter){ ui.filter=t.dataset.filter; paint(); }
  else if(t.dataset.book){ book={ sessionId:t.dataset.book, date:"", time:"" }; go("/book"); }
  else if(t.dataset.time){ book.time=t.dataset.time; paint(); }
  else if(t.dataset.cancel){ setBookings(getBookings().filter(b=>b.id!==t.dataset.cancel)); paint(); }
});

window.addEventListener("hashchange",()=>{ ui.menuOpen=false; paint(); });
paint();
</script>
